<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
    <!-- Link external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Main Heading centered via #main-title ID -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- 2. Self-introduction paragraph -->
    <p>
        Xin chào! Tôi là một học viên lập trình web tại CodeGym. Tôi rất đam mê công nghệ, 
        thích khám phá những kiến thức mới và mong muốn xây dựng các ứng dụng web hữu ích.
    </p>

    <!-- 3. Unordered list with 3 hobbies styled with different classes -->
    <h2>Sở thích của tôi</h2>
    <ul>
        <li class="hobby-coding">Lập trình và xây dựng website</li>
        <li class="hobby-music">Nghe nhạc và chơi guitar</li>
        <li class="hobby-sports">Chơi đá bóng và chạy bộ</li>
    </ul>

    <!-- 4. Interactive button with hover effect -->
    <button type="button" class="action-btn">Nhấn vào đây</button>

</body>
</html>
